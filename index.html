<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaveFBS Downloader — تحميل فيديو وصوت بجودة عالية</title>
  <style>
    :root {
      --bg: #070b14;
      --card: #0f172a;
      --card-2: #162038;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --accent: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.18), transparent 45%),
        radial-gradient(circle at bottom left, rgba(34, 197, 94, 0.1), transparent 40%),
        var(--bg);
      color: var(--text);
      padding: 20px 14px 48px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 660px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand {
      font-size: 1.7rem;
      font-weight: 800;
    }

    .badge-row {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.76rem;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #bfdbfe;
      font-weight: 600;
    }

    .badge.green {
      background: rgba(34, 197, 94, 0.14);
      border-color: rgba(34, 197, 94, 0.35);
      color: #bbf7d0;
    }

    .card {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      margin-bottom: 16px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    input[type="url"] {
      width: 100%;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 13px 14px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="url"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .mini-btn {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 0 13px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .mini-btn:hover {
      background: #1e2d4d;
    }

    .group-box {
      margin: 12px 0;
      padding: 12px;
      border-radius: 14px;
      background: rgba(22, 32, 56, 0.55);
      border: 1px solid var(--border);
    }

    .group-title {
      font-size: 0.82rem;
      color: #cbd5e1;
      font-weight: 700;
      margin-bottom: 8px;
      display: block;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: var(--card-2);
      color: #cbd5e1;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
    }

    .chip:hover {
      border-color: var(--primary);
      color: #fff;
    }

    .chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.35);
    }

    .selection-summary {
      margin-top: 10px;
      font-size: 0.84rem;
      color: #93c5fd;
      font-weight: 700;
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .download-btn {
      width: 100%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 12px;
    }

    .download-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 12px;
      font-size: 0.86rem;
      line-height: 1.5;
      display: none;
    }

    .alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fecaca;
    }

    .alert.warn {
      display: block;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fde68a;
    }

    .alert.info {
      display: block;
      background: rgba(59, 130, 246, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #bfdbfe;
    }

    .preview {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .preview.show {
      display: block;
    }

    .preview-grid {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .thumb {
      width: 128px;
      height: 168px;
      object-fit: cover;
      border-radius: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .meta {
      flex: 1;
      min-width: 0;
    }

    .video-title {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      font-size: 0.82rem;
    }

    .stat-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .stat-box span {
      display: block;
      color: var(--muted);
      font-size: 0.73rem;
      margin-bottom: 2px;
    }

    .history-title {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .history-item:hover {
      border-color: var(--primary);
    }

    .history-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.85rem;
      color: #e2e8f0;
    }

    .empty-msg {
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 520px) {
      .preview-grid {
        flex-direction: column;
      }
      .thumb {
        width: 100%;
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">SaveFBS Downloader</div>
      <div class="badge-row">
        <span class="badge green">iOS MP4 جاهز</span>
        <span class="badge">دمج الدقة + الفريمات</span>
        <span class="badge" id="serverStatus">جاري فحص السيرفر...</span>
      </div>
    </div>

    <div class="card">
      <div class="input-group">
        <input id="urlInput" type="url" placeholder="الصق رابط الفيديو هنا (TikTok, YouTube, وغيرها)..." autocomplete="off" />
        <button class="mini-btn" type="button" id="pasteBtn">لصق</button>
        <button class="mini-btn" type="button" id="clearBtn">مسح</button>
      </div>

      <div class="group-box">
        <span class="group-title">1) اختر الدقة (أو صوت MP3):</span>
        <div class="chips" id="resChips">
          <button type="button" class="chip active" data-res="best">تلقائي</button>
          <button type="button" class="chip" data-res="1080p">1080p</button>
          <button type="button" class="chip" data-res="2k">2K</button>
          <button type="button" class="chip" data-res="4k">4K</button>
          <button type="button" class="chip" data-res="8k">8K</button>
          <button type="button" class="chip" data-res="audio">صوت MP3 فقط</button>
        </div>
      </div>

      <div class="group-box" id="fpsGroup">
        <span class="group-title">2) اختر الفريمات (يمكن دمجها مع الدقة):</span>
        <div class="chips" id="fpsChips">
          <button type="button" class="chip active" data-fps="auto">تلقائي</button>
          <button type="button" class="chip" data-fps="60fps">60fps</button>
          <button type="button" class="chip" data-fps="120fps">120fps</button>
          <button type="button" class="chip" data-fps="interp4">+4 فريمات بين كل فريم</button>
        </div>
        <div class="selection-summary" id="selectionSummary">الاختيار الحالي: دقة (تلقائي) + فريمات (تلقائي)</div>
      </div>

      <button class="primary-btn" id="fetchBtn" type="button">جلب وتحليل الفيديو</button>

      <div id="errorBox" class="alert error"></div>
      <div id="warnBox" class="alert warn"></div>
      <div id="infoBox" class="alert info"></div>

      <div id="previewBox" class="preview">
        <div class="preview-grid">
          <img id="thumbImg" class="thumb" src="" alt="معاينة الفيديو" />
          <div class="meta">
            <div id="videoTitle" class="video-title">—</div>
            <div class="stats">
              <div class="stat-box"><span>المنصة</span><strong id="metaPlatform">—</strong></div>
              <div class="stat-box"><span>المدة</span><strong id="metaDuration">—</strong></div>
              <div class="stat-box"><span>أقصى جودة بالمصدر</span><strong id="metaQuality">—</strong></div>
              <div class="stat-box"><span>أقصى فريمات بالمصدر</span><strong id="metaFps">—</strong></div>
            </div>
          </div>
        </div>
        <button class="download-btn" id="downloadBtn" type="button">تحميل الآن</button>
      </div>
    </div>

    <div class="card">
      <div class="history-title">
        <span>آخر الروابط المحللة</span>
        <button class="mini-btn" type="button" id="clearHistoryBtn" style="padding: 5px 10px; font-size: 0.76rem;">حذف السجل</button>
      </div>
      <div id="historyList" class="history-list">
        <div class="empty-msg">لا يوجد سجل بعد</div>
      </div>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById("urlInput");
    const pasteBtn = document.getElementById("pasteBtn");
    const clearBtn = document.getElementById("clearBtn");
    const resChips = Array.from(document.querySelectorAll("#resChips .chip"));
    const fpsChips = Array.from(document.querySelectorAll("#fpsChips .chip"));
    const fpsGroup = document.getElementById("fpsGroup");
    const selectionSummary = document.getElementById("selectionSummary");
    const fetchBtn = document.getElementById("fetchBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const previewBox = document.getElementById("previewBox");
    const errorBox = document.getElementById("errorBox");
    const warnBox = document.getElementById("warnBox");
    const infoBox = document.getElementById("infoBox");
    const historyList = document.getElementById("historyList");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");
    const serverStatus = document.getElementById("serverStatus");

    let selectedRes = "best";
    let selectedFps = "auto";
    let currentVideoData = null;
    const HISTORY_KEY = "savefbs_history_v3";

    function showAlert(el, msg) {
      if (!msg) {
        el.style.display = "none";
        el.textContent = "";
        return;
      }
      el.textContent = msg;
      el.style.display = "block";
    }

    function formatDuration(sec) {
      const s = Number(sec) || 0;
      if (!s) return "غير معروف";
      const m = Math.floor(s / 60);
      const r = Math.floor(s % 60);
      return `${m}:${String(r).padStart(2, "0")}`;
    }

    function updateSummaryAndWarnings() {
      if (selectedRes === "audio") {
        fpsGroup.style.opacity = "0.5";
        selectionSummary.textContent = "الاختيار الحالي: صوت MP3 فقط";
      } else {
        fpsGroup.style.opacity = "1";
        const fpsLabel =
          selectedFps === "interp4" ? "+4 فريمات بين كل فريم (×5)" : selectedFps;
        selectionSummary.textContent = `الاختيار الحالي: دقة (${selectedRes}) + فريمات (${fpsLabel})`;
      }

      if (selectedRes !== "audio" && (selectedRes === "8k" || selectedFps === "120fps" || selectedFps === "interp4")) {
        showAlert(
          warnBox,
          "ملاحظة: معالجة 8K أو توليد الإطارات البينية تضخّم أبعاد/معدل إطارات الملف عبر FFmpeg، لكنها لا تولّد تفاصيل أو إطارات أصلية غير موجودة في الفيديو، وقد تستغرق وقتاً طويلاً على السيرفر."
        );
      } else {
        showAlert(warnBox, "");
      }
    }

    resChips.forEach((chip) => {
      chip.addEventListener("click", () => {
        selectedRes = chip.dataset.res;
        resChips.forEach((c) => c.classList.toggle("active", c === chip));
        updateSummaryAndWarnings();
      });
    });

    fpsChips.forEach((chip) => {
      chip.addEventListener("click", () => {
        selectedFps = chip.dataset.fps;
        fpsChips.forEach((c) => c.classList.toggle("active", c === chip));
        updateSummaryAndWarnings();
      });
    });

    pasteBtn.addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          urlInput.value = text.trim();
          urlInput.focus();
        }
      } catch {
        showAlert(infoBox, "الصق الرابط يدوياً في خانة الإدخال.");
      }
    });

    clearBtn.addEventListener("click", () => {
      urlInput.value = "";
      previewBox.classList.remove("show");
      currentVideoData = null;
      showAlert(errorBox, "");
      showAlert(infoBox, "");
      updateSummaryAndWarnings();
    });

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveToHistory(item) {
      const list = getHistory().filter((x) => x.url !== item.url);
      list.unshift(item);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 6)));
      renderHistory();
    }

    function renderHistory() {
      const list = getHistory();
      if (!list.length) {
        historyList.innerHTML = '<div class="empty-msg">لا يوجد سجل بعد</div>';
        return;
      }
      historyList.innerHTML = list
        .map(
          (item) => `
          <div class="history-item" data-url="${encodeURIComponent(item.url)}">
            <div class="history-text">${item.title || item.url}</div>
            <span style="color:#93c5fd;font-size:0.78rem;font-weight:700;">تحليل</span>
          </div>`
        )
        .join("");

      historyList.querySelectorAll(".history-item").forEach((el) => {
        el.addEventListener("click", () => {
          urlInput.value = decodeURIComponent(el.dataset.url);
          fetchVideo();
        });
      });
    }

    clearHistoryBtn.addEventListener("click", () => {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    });

    async function fetchVideo() {
      const url = urlInput.value.trim();
      showAlert(errorBox, "");
      showAlert(infoBox, "");

      if (!url) {
        showAlert(errorBox, "يرجى إدخال رابط الفيديو أولاً.");
        return;
      }

      fetchBtn.disabled = true;
      fetchBtn.textContent = "جاري التحليل...";
      previewBox.classList.remove("show");

      try {
        const res = await fetch("/api/fetch-video", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "تعذر تحليل الرابط");
        }

        currentVideoData = { ...data, url };
        document.getElementById("videoTitle").textContent = data.title || "فيديو";
        document.getElementById("metaPlatform").textContent = data.extractor || "منصة";
        document.getElementById("metaDuration").textContent = formatDuration(data.duration);
        document.getElementById("metaQuality").textContent = data.sourceMaxQuality || "تلقائي";
        document.getElementById("metaFps").textContent = data.sourceMaxFps || "تلقائي";

        const thumbImg = document.getElementById("thumbImg");
        if (data.thumbnail) {
          thumbImg.src = data.thumbnail;
          thumbImg.style.display = "block";
        } else {
          thumbImg.style.display = "none";
        }

        previewBox.classList.add("show");
        updateSummaryAndWarnings();
        saveToHistory({ url, title: data.title || url });
      } catch (err) {
        showAlert(errorBox, err.message || "حدث خطأ أثناء تحليل الرابط");
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.textContent = "جلب وتحليل الفيديو";
      }
    }

    fetchBtn.addEventListener("click", fetchVideo);
    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") fetchVideo();
    });

    downloadBtn.addEventListener("click", async () => {
      const url = (currentVideoData && currentVideoData.url) || urlInput.value.trim();
      if (!url) return;

      const isAudio = selectedRes === "audio";
      const title = (currentVideoData && currentVideoData.title) || "SaveFBS";

      downloadBtn.disabled = true;
      downloadBtn.textContent = "جاري تجهيز الملف...";
      showAlert(infoBox, "يتم إرسال الطلب والمعالجة على السيرفر...");

      try {
        const params = new URLSearchParams({
          url,
          mode: isAudio ? "audio" : "video",
          resolution: selectedRes,
          fps: isAudio ? "auto" : selectedFps,
          title,
        });

        const response = await fetch(`/api/download?${params.toString()}`);
        if (!response.ok) {
          const errText = await response.text();
          throw new Error(errText || "فشل التحميل");
        }

        const blob = await response.blob();
        const ext = isAudio ? "mp3" : "mp4";
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = `SaveFBS_${selectedRes}_${selectedFps}.${ext}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
        showAlert(infoBox, "تم تجهيز الملف وبدأ التحميل بنجاح.");
      } catch (err) {
        showAlert(errorBox, err.message || "تعذر تحميل الملف");
        showAlert(infoBox, "");
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.textContent = "تحميل الآن";
      }
    });

    fetch("/api/health")
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => {
        if (d && d.status === "ok") {
          serverStatus.textContent = "السيرفر متصل";
          serverStatus.classList.add("green");
        } else {
          serverStatus.textContent = "السيرفر يستعد";
        }
      })
      .catch(() => {
        serverStatus.textContent = "تحقق من الاتصال";
      });

    updateSummaryAndWarnings();
    renderHistory();
  </script>
</body>
</html>
